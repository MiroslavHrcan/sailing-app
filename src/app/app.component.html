<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="anchor-icon">anchor</mat-icon>
      <span class="app-name">Sailing Log</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
         (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/logbook" routerLinkActive="active-link"
         (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Logbook</span>
      </a>
      <a mat-list-item routerLink="/weather" routerLinkActive="active-link"
         (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>cloud</mat-icon>
        <span matListItemTitle>Weather</span>
      </a>
      <a mat-list-item routerLink="/map" routerLinkActive="active-link"
         (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>map</mat-icon>
        <span matListItemTitle>Map</span>
      </a>
      <a mat-list-item routerLink="/trips" routerLinkActive="active-link"
         (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>sailing</mat-icon>
        <span matListItemTitle>Trips & Ships</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-icon>sailing</mat-icon>
      <span>Fair winds!</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      @if (!isMobile) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">
        <mat-icon>anchor</mat-icon>
        Sailing Log
      </span>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button routerLink="/logbook/new" aria-label="New log entry">
        <mat-icon>add_circle</mat-icon>
      </button>
    </mat-toolbar>

    <main class="main-content" [class.has-bottom-nav]="isMobile">
      <router-outlet />
    </main>

    @if (isMobile) {
      <nav class="bottom-nav">
        <a class="bottom-nav-item" routerLink="/" routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a class="bottom-nav-item" routerLink="/logbook" routerLinkActive="active">
          <mat-icon>menu_book</mat-icon>
          <span>Logbook</span>
        </a>
        <a class="bottom-nav-item" routerLink="/weather" routerLinkActive="active">
          <mat-icon>cloud</mat-icon>
          <span>Weather</span>
        </a>
        <a class="bottom-nav-item" routerLink="/map" routerLinkActive="active">
          <mat-icon>map</mat-icon>
          <span>Map</span>
        </a>
        <a class="bottom-nav-item" routerLink="/trips" routerLinkActive="active">
          <mat-icon>sailing</mat-icon>
          <span>Trips</span>
        </a>
      </nav>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
