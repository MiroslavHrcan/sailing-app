[build]
  command = "ng build --configuration production"
  publish = "dist/sailing-app/browser"

# Proxy MeteoAlarm API to avoid CORS (must come before the SPA catch-all)
[[redirects]]
  from = "/api/meteoalarm/*"
  to = "https://feeds.meteoalarm.org/api/v1/warnings/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
